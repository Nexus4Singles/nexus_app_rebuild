name: nexus_app_v2
version: 2.0.5+64
description: Nexus Dating App - v2 with enhanced features and dating profiles.
publish_to: "none"

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  crypto: ^3.0.3
  http: ^1.2.2
  cached_network_image: ^3.4.1
  sqflite: ^2.3.0
  just_audio: ^0.9.38
  audioplayers: ^5.2.1
  google_mlkit_face_detection: ^0.13.1
  country_picker: ^2.0.27
  flutter_svg: ^2.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_riverpod: ^2.6.1
  go_router: ^13.2.5
  equatable: ^2.0.5
  intl: ^0.20.2
  shared_preferences: ^2.5.4
  firebase_core: ^4.3.0
  firebase_analytics: ^12.2.0
  firebase_app_check: ^0.4.1+3
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  firebase_storage: ^13.0.5
  firebase_messaging: ^16.1.0
  flutter_local_notifications: ^18.0.1
  image_picker: ^1.2.1
  image_cropper: ^11.0.0
  file_picker: ^8.1.1
  record: ^6.1.2
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  google_mlkit_commons: ^0.11.0
  confetti: ^0.8.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.2.1
  share_plus: ^12.0.1
  flutterwave_standard: ^1.1.0
  fluttertoast: ^8.2.0
  cloud_functions: ^6.0.0
  google_sign_in: ^7.2.0
  purchases_flutter: ^10.7.0
  package_info_plus: ^9.0.0
  flutter_image_compress: ^2.4.0
  google_mobile_ads: ^9.0.0

dev_dependencies:
  flutter_launcher_icons: ^0.13.1

flutter:
  assets:
    - assets/images/stories/
    - assets/images/social_icons/
    - assets/images/journeys/
    - assets/config/journeys/singles journeys/
    - assets/config/journeys/married journeys/
    - assets/config/journeys/divorced journeys/
    - assets/config/journeys/widowed journeys/
    - assets/config/assessments/
    - assets/config/journey_id_filename_map.json
    - assets/images/
    - assets/data/churches_v1.json
    - assets/data/nexus1_onboarding_lists.v1.json
    - assets/config/engagement/
  uses-material-design: true

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
